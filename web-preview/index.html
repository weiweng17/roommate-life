<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roommate Life</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15131d;color:#f7efe8;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}#app{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 8%,#31283d,#17151f 52%,#111018)}canvas{position:absolute;inset:0;width:100%;height:100%}.panel{position:absolute;background:rgba(27,23,32,.91);border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:0 14px 45px rgba(0,0,0,.3);backdrop-filter:blur(10px)}#stats{left:18px;top:18px;width:250px;padding:16px}h2{margin:0 0 4px;font-size:23px}#stats>p{margin:0 0 12px;color:#bdb2b8;font-size:13px}.row{display:grid;grid-template-columns:42px 1fr 34px;gap:8px;align-items:center;margin:8px 0;font-size:13px}.bar{height:8px;background:#3a3340;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#e4a17e,#de7193);border-radius:99px}#clockBox{left:50%;top:18px;transform:translateX(-50%);padding:12px 22px;font-weight:700}#brain{right:18px;top:18px;width:280px;padding:16px}.hint{margin-top:8px;color:#ada1aa;font-size:12px;line-height:1.45}#actions{left:50%;bottom:18px;transform:translateX(-50%);padding:10px;display:flex;gap:8px}button{border:0;border-radius:12px;background:#3a303c;color:#fff;padding:11px 15px;cursor:pointer;font-size:14px;white-space:nowrap}button:hover{background:#59414f}#toast{left:50%;bottom:88px;transform:translateX(-50%);padding:10px 18px;background:rgba(255,247,236,.95);color:#332a2e;min-width:300px;text-align:center;opacity:0;transition:.2s;pointer-events:none}.show{opacity:1!important}#badge{position:absolute;right:18px;bottom:18px;color:#746a76;font-size:11px}@media(max-width:900px){#stats,#brain{transform:scale(.78)}#stats{transform-origin:top left}#brain{transform-origin:top right}#actions{width:94%;overflow:auto;justify-content:flex-start}}
</style>
</head>
<body><div id="app"><canvas id="game" width="1280" height="720"></canvas><div id="stats" class="panel"><h2>小满 · Roommate</h2><p>她会根据自己的状态自主生活。</p><div id="rows"></div></div><div id="clockBox" class="panel"><span id="clock">雨夜 21:30</span> · <span id="coins">¥120</span></div><div id="brain" class="panel"><strong id="now">现在：发呆</strong><div class="hint">小满会自己吃饭、睡觉、洗澡、玩电脑和看雨。你也可以直接安排她。</div></div><div id="actions" class="panel"></div><div id="toast" class="panel"></div><div id="badge">Roommate Life · 2.5D browser MVP</div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=1280,H=720,TW=64,TH=32,TZ=38,O={x:640,y:175};
const P=(id,k,ox,oy,oz,sx,sy,sz,col,act='')=>({id,k,o:{x:ox,y:oy,z:oz},s:{x:sx,y:sy,z:sz},col,act});
const props=[P('floor','floor',0,0,0,12,.05,9,'#685648'),P('rug','floor',4.1,.06,4,3.4,.02,2.2,'#80585e'),P('back','box',0,0,0,12,4,.18,'#645a65'),P('left','box',0,0,0,.18,4,9,'#5c5360'),P('bed','soft',1,0,1.1,3.1,.75,2.2,'#9aa88e','sleep'),P('desk','box',6.6,0,1,2.6,.95,1.2,'#6f4b36','computer'),P('pc','box',7.25,.95,1.18,1.1,.9,.18,'#252331'),P('fridge','box',9.5,0,1,1.25,2.2,1.25,'#c9c6bb','eat'),P('shower','box',9.35,0,6.25,1.45,2.35,1.6,'#7295a0','shower'),P('sofa','soft',3.2,0,6.1,3.2,.9,1.45,'#896c66','chat'),P('window','box',5,1.2,.08,2.5,1.8,.08,'#28364f','relax'),P('plant','round',1,0,6.2,.9,1.5,.9,'#5a6d50')];
const anchors={sleep:[2.55,3.55],computer:[7.9,2.75],eat:[10.1,3.0],shower:[10.1,5.35],chat:[4.8,5.35],relax:[6.25,1.7]};
const labels={idle:'发呆',sleep:'睡觉',eat:'吃东西',shower:'洗澡',computer:'玩电脑',chat:'和你聊天',relax:'看雨发呆'};
const state=Object.assign({mood:72,fullness:68,energy:74,hygiene:78,fun:55,affection:20,coins:120,minute:1290},JSON.parse(localStorage.getItem('roommate-life')||'{}'));
const actor={x:5.6,z:5,tx:5.6,tz:5,pending:'',move:false,phase:0};let current='idle',activity=0,think=1,toastLeft=0;
const names=[['mood','心情'],['fullness','饱食'],['energy','精力'],['hygiene','卫生'],['fun','娱乐'],['affection','亲密']];
for(const [k,n] of names){const d=document.createElement('div');d.className='row';d.innerHTML=`<span>${n}</span><div class="bar"><div class="fill" id="f-${k}"></div></div><span id="v-${k}"></span>`;rows.appendChild(d)}
for(const id of ['eat','shower','computer','chat','relax','sleep']){const b=document.createElement('button');b.textContent=labels[id];b.onclick=()=>request(id,true);actions.appendChild(b)}
function screen(p){return{x:(p.x-p.z)*TW*.5+O.x,y:(p.x+p.z)*TH*.5-p.y*TZ+O.y}}function depth(p){return p.o.x+p.s.x+p.o.z+p.s.z+p.o.y*.5}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');toastLeft=2.2}
function request(id,manual=false){if(activity>0)return;const a=anchors[id];if(!a)return;actor.tx=a[0];actor.tz=a[1];actor.pending=id;actor.move=true;current='going_'+id;if(manual)toast('你安排了：'+labels[id])}
function choose(){const s={eat:100-state.fullness,sleep:100-state.energy,shower:100-state.hygiene,computer:100-state.fun,relax:35+(100-state.mood)*.35};return Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0]}
function finish(id){if(id==='sleep'){state.energy=Math.min(100,state.energy+48);state.mood=Math.min(100,state.mood+5)}if(id==='eat'){state.fullness=Math.min(100,state.fullness+42);state.mood=Math.min(100,state.mood+3)}if(id==='shower'){state.hygiene=Math.min(100,state.hygiene+55);state.mood=Math.min(100,state.mood+4)}if(id==='computer'){state.fun=Math.min(100,state.fun+38);state.energy=Math.max(0,state.energy-7)}if(id==='chat'){state.affection=Math.min(100,state.affection+7);state.mood=Math.min(100,state.mood+8)}if(id==='relax'){state.mood=Math.min(100,state.mood+12);state.fun=Math.min(100,state.fun+8)}current='idle';activity=0;toast(labels[id]+'完成');save()}
function update(dt){state.minute=(state.minute+dt*1.5)%1440;state.fullness=Math.max(0,state.fullness-dt*.0525);state.energy=Math.max(0,state.energy-dt*.042);state.hygiene=Math.max(0,state.hygiene-dt*.03);state.fun=Math.max(0,state.fun-dt*.027);if(actor.move){const dx=actor.tx-actor.x,dz=actor.tz-actor.z,dist=Math.hypot(dx,dz);if(dist<.08){actor.x=actor.tx;actor.z=actor.tz;actor.move=false;current=actor.pending;activity={sleep:5.5,eat:3.5,shower:4.5,computer:4.5,chat:3.5,relax:3}[current]||2;toast('小满正在'+labels[current]+'……')}else{const step=Math.min(dist,dt*2.2);actor.x+=dx/dist*step;actor.z+=dz/dist*step;actor.phase+=step*5}}else if(activity>0){activity-=dt;if(activity<=0)finish(current)}else{think-=dt;if(think<=0){think=1.2;request(choose())}}if(toastLeft>0){toastLeft-=dt;if(toastLeft<=0)document.getElementById('toast').classList.remove('show')}ui()}
function shade(h,a){let n=parseInt(h.slice(1),16),r=(n>>16)+a,g=((n>>8)&255)+a,b=(n&255)+a;return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('')}function poly(q,col){x.beginPath();x.moveTo(q[0].x,q[0].y);for(let i=1;i<q.length;i++)x.lineTo(q[i].x,q[i].y);x.closePath();x.fillStyle=col;x.fill()}
function faces(p){const o=p.o,s=p.s,y=o.y+s.y;return{t:[screen({x:o.x,y,z:o.z}),screen({x:o.x+s.x,y,z:o.z}),screen({x:o.x+s.x,y,z:o.z+s.z}),screen({x:o.x,y,z:o.z+s.z})],l:[screen({x:o.x,y,z:o.z+s.z}),screen({x:o.x+s.x,y,z:o.z+s.z}),screen({x:o.x+s.x,y:o.y,z:o.z+s.z}),screen({x:o.x,y:o.y,z:o.z+s.z})],r:[screen({x:o.x+s.x,y,z:o.z}),screen({x:o.x+s.x,y,z:o.z+s.z}),screen({x:o.x+s.x,y:o.y,z:o.z+s.z}),screen({x:o.x+s.x,y:o.y,z:o.z})]}}
function drawProp(p){const f=faces(p);if(p.k==='floor'){poly(f.t,shade(p.col,25));return}if(p.k==='round'){const m=screen({x:p.o.x+p.s.x/2,y:0,z:p.o.z+p.s.z/2});x.fillStyle=p.col;x.beginPath();x.ellipse(m.x,m.y,18,8,0,0,Math.PI*2);x.fill();x.beginPath();x.arc(m.x,m.y-24,14,0,Math.PI*2);x.fill();return}poly(f.l,shade(p.col,-18));poly(f.r,shade(p.col,-32));poly(f.t,shade(p.col,24));if(p.id==='window'){const m=screen({x:6.25,y:2,z:.08});x.fillStyle='rgba(111,134,171,.75)';x.fillRect(m.x-40,m.y-28,80,56)}}
function drawActor(){const p=screen({x:actor.x,y:0,z:actor.z}),bob=actor.move?Math.sin(actor.phase*2)*2:0;x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(p.x,p.y+6,18,7,0,0,Math.PI*2);x.fill();x.fillStyle='#c57468';x.fillRect(p.x-10,p.y-42+bob,20,32);x.fillStyle='#f0c4a8';x.beginPath();x.arc(p.x,p.y-53+bob,12,0,Math.PI*2);x.fill()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#171622';x.fillRect(0,0,W,H);for(let i=0;i<18;i++){x.fillStyle='rgba(89,122,179,.18)';x.fillRect(420+(i%6)*78,80+Math.floor(i/6)*32,22,10)}const ps=[...props].sort((a,b)=>depth(a)-depth(b)),ad=actor.x+actor.z+.8;let done=false;for(const p of ps){if(!done&&depth(p)>=ad){drawActor();done=true}drawProp(p)}if(!done)drawActor()}
function ui(){let h=Math.floor(state.minute/60),m=Math.floor(state.minute)%60;clock.textContent=`雨夜 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;coins.textContent='¥'+state.coins;now.textContent='现在：'+(current.startsWith('going_')?'走向'+labels[current.slice(6)]:labels[current]||current);for(const[k]of names){document.getElementById('v-'+k).textContent=Math.round(state[k]);document.getElementById('f-'+k).style.width=Math.max(0,Math.min(100,state[k]))+'%'}}function save(){localStorage.setItem('roommate-life',JSON.stringify(state))}setInterval(save,8000);let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}toast('小满正在房间里生活。');requestAnimationFrame(loop);
</script></body></html>
